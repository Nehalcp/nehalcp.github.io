name: Fix profile image position

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-profile-position:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update profile image position
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/css/style.css")
          text = path.read_text()
          old = "object-position: 18% 23%;"
          new = "object-position: 40% 25%;"

          if old not in text:
              raise SystemExit("Expected profile position was not found; no changes made.")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit CSS change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css
          git rm .github/workflows/fix-profile-position.yml
          git commit -m "Set profile image position to 40% 25%"
          git push
